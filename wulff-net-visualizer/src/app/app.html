<div class="main-layout" style="display: flex; gap: 20px; background: #0f172a; color: white; padding: 20px; min-height: 100vh; font-family: 'Inter', sans-serif;">
  
  <aside class="panel" style="width: 280px; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column;">
    <h3 style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase;">Point Coordinates</h3>
    
    <div style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
      <div class="field">
        <label style="display: block; font-size: 0.7rem; color: #64748b; margin-bottom: 5px;">U (Axis A):</label>
        <input type="number" step="1" [(ngModel)]="uvw.v" (ngModelChange)="onManualInputChange()" 
               style="width: 100%; background: #0f172a; color: white; border: 1px solid #334155; padding: 10px; border-radius: 6px; outline: none;">
      </div>
      <div class="field">
        <label style="display: block; font-size: 0.7rem; color: #64748b; margin-bottom: 5px;">V (Axis B):</label>
        <input type="number" step="1" [(ngModel)]="uvw.u" (ngModelChange)="onManualInputChange()" 
               style="width: 100%; background: #0f172a; color: white; border: 1px solid #334155; padding: 10px; border-radius: 6px; outline: none;">
      </div>
      <div class="field">
        <label style="display: block; font-size: 0.7rem; color: #64748b; margin-bottom: 5px;">W (Axis C):</label>
        <input type="number" step="1" [(ngModel)]="uvw.w" (ngModelChange)="onManualInputChange()" 
               style="width: 100%; background: #0f172a; color: white; border: 1px solid #334155; padding: 10px; border-radius: 6px; outline: none;">
      </div>
    </div>

    <button (click)="simplifyCurrentView()" 
            style="width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 15px;">
      SIMPLIFY INDICES
    </button>

    <div style="margin-top: auto; padding: 12px; background: #0f172a; border-radius: 8px; font-size: 0.85rem; color: #facc15; border-left: 4px solid #facc15;">
      Vector: [{{uvw.u}}, {{uvw.v}}, {{uvw.w}}]
    </div>
  </aside>

  <main class="visualizer-wrapper" style="flex-grow: 1; position: relative; background: #0f172a; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b;">
    <div style="position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; background: #1e293b; padding: 4px; border-radius: 20px; border: 1px solid #334155;">
      <button (click)="isSphereMode = false" [style.background]="!isSphereMode ? '#10b981' : 'transparent'" [style.color]="!isSphereMode ? 'white' : '#94a3b8'" style="border: none; cursor: pointer; padding: 8px 20px; border-radius: 16px; font-size: 0.7rem; font-weight: bold;">2D NET</button>
      <button (click)="isSphereMode = true" [style.background]="isSphereMode ? '#10b981' : 'transparent'" [style.color]="isSphereMode ? 'white' : '#94a3b8'" style="border: none; cursor: pointer; padding: 8px 20px; border-radius: 16px; font-size: 0.7rem; font-weight: bold;">3D SPHERE</button>
    </div>

    <app-wulff-net [(azimuth)]="azimuth" [(polar)]="polar" [isSphereMode]="isSphereMode" [uvw]="uvw" (uvwChange)="handleUvwChange($event)"></app-wulff-net>
  </main>

  <aside class="panel" style="width: 280px; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155;">
    <h3 style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; letter-spacing: 1px; text-transform: uppercase;">Projection</h3>
    
    <div style="margin-bottom: 30px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <label style="font-size: 0.75rem; color: #f1f5f9;">AZIMUTH (Φ):</label>
        <input type="number" [(ngModel)]="azimuth" style="width: 70px; background: #0f172a; color: #10b981; border: 1px solid #334155; padding: 5px; border-radius: 4px; text-align: center; font-weight: bold;">
      </div>
      <input type="range" min="0" max="360" [(ngModel)]="azimuth" style="width: 100%; accent-color: #10b981;">
    </div>

    <div style="margin-bottom: 30px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <label style="font-size: 0.75rem; color: #f1f5f9;">POLAR (P):</label>
        <input type="number" [(ngModel)]="polar" style="width: 70px; background: #0f172a; color: #10b981; border: 1px solid #334155; padding: 5px; border-radius: 4px; text-align: center; font-weight: bold;">
      </div>
      <input type="range" min="0" max="180" [(ngModel)]="polar" style="width: 100%; accent-color: #10b981;">
    </div>

    <div style="border-top: 1px solid #334155; padding-top: 20px; font-size: 0.7rem;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div [style.background]="polar > 90 ? '#94a3b8' : '#ffffff'" style="width: 12px; height: 12px; border-radius: 50%;"></div>
        <span style="color: #cbd5e1;">{{ polar > 90 ? 'Lower Hemisphere' : 'Upper Hemisphere' }}</span>
      </div>
    </div>
  </aside>
</div>
